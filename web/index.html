<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Encrypt and decrypt messages and files with age and OpenPGP. Runs entirely in your browser, makes no network requests, and stores nothing on a server.">
  <meta name="theme-color" content="#1e5f74" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191a19" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="index, follow">

  <!-- same policy the deploy configs send, for hosts without header support -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="web-crypt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>web-crypt</title>

  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fbfbfa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #191a19; }
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #56564f;
      font-size: 14px;
      transition: opacity 200ms ease;
    }
    @media (prefers-color-scheme: dark) { #boot { color: #b2b3ae; } }
    #boot .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 2px solid currentColor;
      opacity: 0.35;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .mark { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="mark"></div>
    <div>Starting web-crypt&hellip;</div>
    <noscript>web-crypt needs JavaScript. Everything runs in your browser, so there is no server to fall back to.</noscript>
  </div>

  <script src="boot.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
