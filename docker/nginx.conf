worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout combined;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  # an unprivileged user cannot write to the default paths
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/wasm image/svg+xml
    font/ttf font/otf font/woff2;

  server {
    listen 8080;
    server_name _;
    root /srv/web-crypt;
    index index.html;

    # as the deploy configs, minus upgrade-insecure-requests for plain http
    include /etc/nginx/security-headers.conf;

    location = /health {
      access_log off;
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
      return 200 "ok\n";
    }

    location ~* \.(ttf|otf|woff2|png|svg)$ {
      expires 1y;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, immutable";
    }

    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }

    location = /flutter_service_worker.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }

    # a missing file is a 404, not the app
    location ~ \.[^/]+$ {
      try_files $uri =404;
    }

    # fallback so the deep-linkable routes work
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
