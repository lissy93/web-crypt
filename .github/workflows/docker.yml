# Publishes the amd64 and arm64 image to GHCR, and to Docker Hub if set up
#
# - a release tag (X.Y.Z) publishes :X.Y.Z, :X.Y, :X.x, and :latest if newest
# - a manual run republishes a given tag, or the current branch as :latest
# - a weekly run rebuilds the newest release as :latest, for base image patches
#
# Docker Hub needs a DOCKERHUB_PASSWORD secret (an access token), and takes
# the DOCKER_USERNAME and DOCKER_REPO variables if they differ from lissy93
name: 🐳 Publish Docker Image

on:
  push:
    # loose, so a tag that isn't X.Y.Z fails loudly instead of never running
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to republish (empty = this branch as :latest)
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * 0'

# per ref, so back-to-back releases each still get published
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_IMAGE: ghcr.io/${{ github.repository }}
  DH_IMAGE: docker.io/${{ vars.DOCKER_REPO || 'lissy93/web-crypt' }}
  SEMVER: '^[0-9]+\.[0-9]+\.[0-9]+$' # what counts as a release tag

jobs:
  plan:
    name: 🔢 Pick the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to find the newest release
          persist-credentials: false

      - name: Work out what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          newest=$(git tag -l --sort=-v:refname | grep -Em1 "$SEMVER" || true)
          case "$EVENT" in
            push) tag=$REF_NAME ;;
            schedule) tag=$newest ;;
            *) tag=$INPUT_TAG ;;
          esac

          if [ "$EVENT" = schedule ] && [ -z "$tag" ]; then
            echo "::notice::No release yet, so nothing to rebuild"
            exit 0
          fi
          ref=$GITHUB_REF
          if [ -n "$tag" ]; then
            grep -qE "$SEMVER" <<< "$tag" || fail "'$tag' isn't like 1.2.3"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
              || fail "There's no tag '$tag'"
            ref=refs/tags/$tag
          fi

          # a weekly rebuild refreshes :latest, but leaves X.Y.Z as released
          versions=true
          if [ -z "$tag" ] || [ "$EVENT" = schedule ]; then versions=false; fi
          echo "Publishing $ref (versions=$versions)"
          {
            echo "ref=$ref"
            echo "tag=$tag"
            echo "versions=$versions"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: 🚀 Build and publish
    needs: plan
    if: needs.plan.outputs.ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # send the image scan to code scanning
      id-token: write # sign the provenance through Sigstore
      attestations: write # keep the signed provenance on the repo
      artifact-metadata: write # the attestation's storage record
    env:
      HAS_DH: ${{ secrets.DOCKERHUB_PASSWORD != '' }}
      VERSIONS: ${{ needs.plan.outputs.versions }}
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      # no QEMU needed, the serve stage is COPY only
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # the docker exporter can't carry attestations, the push adds them
      - name: Build amd64 locally to scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: web-crypt:scan
          provenance: false

      # advisory, since failing would leave the older, less patched image live
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: web-crypt:scan
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - name: Send the scan to code scanning
        if: hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

      # checked just before the push, so an older, slower run can't win
      - name: Check :latest only moves forward
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          latest=true
          if [ -n "$TAG" ]; then
            newest=$(gh api --paginate -q '.[].name' "repos/$GH_REPO/tags" \
              | grep -E "$SEMVER" | sort -V | tail -n1)
            [ "$TAG" = "$newest" ] || latest=false
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # git context, so versions and labels follow the checkout, not the event
      - name: Generate tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.GH_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.guard.outputs.latest }}
            type=semver,pattern={{version}},enable=${{ env.VERSIONS }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.VERSIONS }}
            type=semver,pattern={{major}}.x,enable=${{ env.VERSIONS }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # no shared cache, so a release never builds on what a branch run left
      - name: Build both arches and push to GHCR
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Sign the provenance (GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        continue-on-error: true
        with:
          subject-name: ${{ env.GH_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Docker Hub is a mirror, so it never blocks or undoes the GHCR release
      - name: Log in to Docker Hub
        if: env.HAS_DH == 'true'
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKER_USERNAME || 'lissy93' }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # one source keeps the index byte for byte, so the digest matches GHCR
      - name: Copy to Docker Hub
        id: dh
        if: env.HAS_DH == 'true'
        continue-on-error: true
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while read -r tag; do
            args+=(-t "$DH_IMAGE:${tag##*:}")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$GH_IMAGE@$DIGEST"

      - name: Sign the provenance (Docker Hub)
        if: steps.dh.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        continue-on-error: true
        with:
          subject-name: ${{ env.DH_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write the summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          DH: ${{ steps.dh.outcome }}
        run: |
          {
            echo "## 🐳 Published \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Docker Hub ($DH_IMAGE, same tags): $DH"
            echo
            echo "Verify it with:"
            echo '```bash'
            echo "gh attestation verify oci://$GH_IMAGE@$DIGEST \\"
            echo "  --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
